name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.20'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: backend
      - run: uv run pytest -m 'not integration' --cov=pulse --cov-fail-under=80
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.20'
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: docker compose -f compose.yaml -f compose.dev.yaml up -d --wait postgres redis
      - run: uv run alembic upgrade head && uv run alembic upgrade head
        working-directory: backend
      - run: uv run pytest -m integration -v
        working-directory: backend
        env:
          PULSE_INTEGRATION: '1'
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:8080/ && curl --fail http://localhost:8080/api/v1/health/ready
      - name: Dependency failure and recovery
        shell: bash
        run: |
          docker compose stop redis
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/ready)" = 503
          curl --fail http://localhost:8000/api/v1/health/live
          docker compose start redis
          docker compose up -d --wait
          curl --fail http://localhost:8000/api/v1/health/ready
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

name: pulse

x-backend: &backend
  image: pulse-backend:local
  build: ./backend
  environment: &backend-env
    PULSE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse_local_only}@postgres:5432/${POSTGRES_DB:-pulse}
    PULSE_REDIS_URL: redis://redis:6379/0
  networks: [internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_local_only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *backend
    ports: [127.0.0.1:8000:8000]
    read_only: true
    tmpfs: [/tmp]
    init: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: pulse-frontend:local
    ports: [127.0.0.1:8080:8080]
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
